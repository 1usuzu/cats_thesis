services:

  # === LLM INFERENCE NODES ===

  cloud-node:
    image: ollama/ollama:0.31.2
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_QUEUE=50
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    volumes:
      - cloud-models:/root/.ollama
      - ./cloud-node/entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]
    ports:
      - "11434:11434"
    networks:
      - data-plane
      - control-plane
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4.0"

  edge-node:
    image: ollama/ollama:0.31.2
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_QUEUE=50
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - edge-models:/root/.ollama
      - ./edge-node/entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]
    ports:
      - "11435:11434"
    networks:
      - data-plane
      - control-plane
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4.0"

  # === NETWORK EMULATION ===

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "8001:8001"
      - "8002:8002"
    networks:
      - data-plane
      - control-plane
    restart: unless-stopped

  toxiproxy-init:
    build:
      context: ./network
    environment:
      - TOXIPROXY_API=http://toxiproxy:8474
    command: sh -c "sleep 3 && python init_proxies.py"
    networks:
      - data-plane
      - control-plane
    depends_on:
      toxiproxy:
        condition: service_started
    restart: "no"

  # === POLICY ENGINE ===

  opa:
    image: openpolicyagent/opa:1.18.2
    command: run --server --addr :8181 --log-level error
    volumes:
      - ./safety/policies:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - control-plane
    restart: unless-stopped

  # === ORCHESTRATOR (Tier-1 + Tier-2) ===

  orchestrator:
    build:
      context: ./orchestrator
    env_file: .env
    environment:
      - CLOUD_METRICS_URL=http://cloud-node:11434
      - EDGE_METRICS_URL=http://edge-node:11434
      - STRATEGIC_AGENT_URL=http://edge-node:11434
      - TOXIPROXY_API=http://toxiproxy:8474
      - OPA_URL=http://opa:8181/v1/data/routing
    volumes:
      - ./safety/policies:/safety/policies
    ports:
      - "8080:8080"
    networks:
      - control-plane
      - data-plane
    depends_on:
      toxiproxy-init:
        condition: service_completed_successfully
      opa:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  # === LITELLM PROXY ===

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    networks:
      - data-plane
      - control-plane

  # === GATEWAY (Ingress) ===

  gateway:
    build:
      context: ./gateway
    env_file: .env
    environment:
      - BENCHMARK_STRATEGY=PROPOSED
      - ORCHESTRATOR_URL=http://orchestrator:8080/route
      - ORCHESTRATOR_METRICS_URL=http://orchestrator:8080/metrics/update
      - CLOUD_INFERENCE_URL=http://toxiproxy:8001
      - EDGE_INFERENCE_URL=http://toxiproxy:8002
      - CLOUD_METRICS_URL=http://cloud-node:11434
      - EDGE_METRICS_URL=http://edge-node:11434
      - USE_REAL_CLOUD_API=${USE_REAL_CLOUD_API:-false}
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
    ports:
      - "8000:8000"
    networks:
      - data-plane
      - control-plane
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M


  # === WEB UI (Next.js) ===
  
  web:
    build:
      context: ./web
    environment:
      - GATEWAY_URL=http://gateway:8000
      - ORCHESTRATOR_URL=http://orchestrator:8080
    ports:
      - "3001:3000"
    networks:
      - data-plane
      - control-plane
    depends_on:
      gateway:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === INTERNET TUNNEL ===
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http web:3000
    ports:
      - "4040:4040"
    networks:
      - data-plane
    depends_on:
      web:
        condition: service_healthy

  # === TELEMETRY ===

  prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - control-plane
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.0
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - control-plane
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  cloud-models:
  edge-models:
  prometheus-data:
  grafana-data:

networks:
  data-plane:
    driver: bridge
  control-plane:
    driver: bridge

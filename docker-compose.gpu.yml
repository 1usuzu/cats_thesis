# GPU override for cloud-node (NVIDIA)
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Or:    make docker-up (default target includes GPU)
services:
  cloud-node:
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
